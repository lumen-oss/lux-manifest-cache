name: Update Manifest Cache

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */2 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Download moonrocks mirror
        run: |
          sudo apt-get install -y pigz pv
          rm -rf mirror
          mkdir -p mirror
          curl -fsSL https://github.com/rocks-moonscript-org/moonrocks-mirror/archive/refs/heads/master.tar.gz \
            | pigz -dc | pv | tar x --strip-components=1 -C mirror/

      - name: Fetch luarocks.org manifest
        run: curl -fsSL -o manifest.json https://luarocks.org/manifest.json

      - name: Compute cache key
        id: manifest
        run: |
          echo "hash=$(sha256sum manifest.json | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Restore package cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: packages/
          key: packages-v5-flat-${{ steps.manifest.outputs.hash }}

      - name: Build cache
        if: steps.cache.outputs.cache-hit != 'true'
        run: nix develop --command lua build-cache.lua

      - name: Save package cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: packages/
          key: packages-v5-flat-${{ steps.manifest.outputs.hash }}

      - name: Deploy to VPS
        uses: Burnett01/rsync-deployments@v8
        with:
          switches: -avz --delete
          path: packages/
          remote_path: /srv/lux-manifest-cache/packages/
          remote_host: beta.luanox.org
          remote_user: manifest-ci
          remote_key: ${{ secrets.LUX_MANIFEST_CACHE_DEPLOY_KEY }}
